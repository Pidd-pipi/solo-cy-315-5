        type: string
      end_time:
        maxLength: 8
        type: string
      name:
        maxLength: 128
        type: string
      start_time:
        maxLength: 8
        type: string
    required:
    - code
    - end_time
    - name
    - start_time
    type: object
  github_com_gbschedule_gbschedule_internal_dto.GenerateScheduleRequest:
    properties:
      class_ids:
        items:
          type: integer
        type: array
      classroom_ids:
        items:
          type: integer
        type: array
      courses:
        items:
          $ref: '#/definitions/github_com_gbschedule_gbschedule_internal_dto.CourseRequirement'
        minItems: 1
        type: array
      days_per_week:
        maximum: 7
        minimum: 1
        type: integer
      periods_per_day:
        maximum: 20
        minimum: 1
        type: integer
      semester:
        maxLength: 128
        type: string
      teacher_ids:
        items:
          type: integer
        type: array
      weeks:
        maximum: 30
        minimum: 1
        type: integer
    required:
    - courses
    - days_per_week
    - periods_per_day
    - weeks
    type: object
  github_com_gbschedule_gbschedule_internal_dto.MoveScheduleRequest:
    properties:
      classroom_id:
        type: integer
      day_of_week:
        maximum: 7
        minimum: 1
        type: integer
      schedule_id:
        type: integer
      time_slot_id:
        type: integer
      week:
        minimum: 1
        type: integer
    required:
    - classroom_id
    - day_of_week
    - schedule_id
    - time_slot_id
    - week
    type: object
  github_com_gbschedule_gbschedule_internal_dto.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  github_com_gbschedule_gbschedule_internal_dto.SwapScheduleRequest:
