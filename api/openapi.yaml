basePath: /
definitions:
  github_com_gbschedule_gbschedule_internal_dto.CourseRequirement:
    properties:
      class_id:
        type: integer
      consecutive:
        type: boolean
      course_id:
        type: integer
      teacher_id:
        type: integer
      weekly_periods:
        maximum: 40
        minimum: 1
        type: integer
    required:
    - course_id
    - weekly_periods
    type: object
  github_com_gbschedule_gbschedule_internal_dto.CreateClassRequest:
    properties:
      grade:
        maxLength: 64
        type: string
      name:
        maxLength: 128
        type: string
      student_count:
        minimum: 1
        type: integer
    required:
    - name
    - student_count
    type: object
  github_com_gbschedule_gbschedule_internal_dto.CreateClassroomRequest:
    properties:
      capacity:
        minimum: 1
        type: integer
      code:
        maxLength: 64
        type: string
      equipment:
        items:
          type: string
        type: array
      name:
        maxLength: 128
        type: string
    required:
    - capacity
    - code
    - name
    type: object
  github_com_gbschedule_gbschedule_internal_dto.CreateCourseRequest:
    properties:
      code:
        maxLength: 64
        type: string
      duration:
        minimum: 1
        type: integer
      name:
